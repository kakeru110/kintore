<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>種目の管理 - SIGNAL</title>
<script>
(function () {
  var t = localStorage.getItem("muscleLog.theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#17181c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <p class="breadcrumb"><a href="index.html">← 記録に戻る</a></p>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="表示テーマを切り替え"></button>
  </div>
  <h1>種目の管理</h1>
  <p class="subtitle">ここで追加した種目が、記録画面の選択肢に表示されます</p>
</header>

<main>
  <section class="card" aria-labelledby="add-exercise-heading">
    <h2 id="add-exercise-heading">種目を追加</h2>
    <form id="exercise-form">
      <div class="field-row">
        <label for="new-exercise-name">種目名</label>
        <input type="text" id="new-exercise-name" placeholder="例: スミスショルダープレス" required>
        <p id="category-preview" class="import-help" hidden>推測した部位: <span id="category-preview-label"></span></p>
      </div>
      <button type="submit" class="btn-primary">追加する</button>
    </form>
  </section>

  <section class="card" aria-labelledby="exercise-list-heading">
    <h2 id="exercise-list-heading">登録済みの種目（<span id="exercise-count">0</span>）</h2>
    <div id="exercise-list"></div>
    <p id="exercise-empty" class="empty-message" hidden>まだ種目がありません</p>
    <p class="sync-status" id="sync-status"></p>
  </section>
</main>

<footer class="app-footer">
  <p>GitHub同期の設定は<a href="index.html">記録画面</a>で行えます</p>
</footer>

<script src="sync.js?v=33"></script>
<script src="exercises.js?v=33"></script>
</body>
</html>
